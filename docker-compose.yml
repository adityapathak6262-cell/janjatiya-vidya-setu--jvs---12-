version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jvs-postgres
    restart: always
    environment:
      POSTGRES_USER: jvs_admin
      POSTGRES_PASSWORD: jvs_secure_password_2026
      POSTGRES_DB: jvs_mota_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jvs_admin -d jvs_mota_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jvs-redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jvs-app
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
